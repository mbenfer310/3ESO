<style>
/* Layout: sticky header with always-visible PDF button; a hero where Copy The Cat talks in a speech bubble;
   three chunky level cards; one focused question card at a time with a dot map of the 20 questions. */
:root {
  --bg: #EAF6FF; --surface: #FFFFFF; --ink: #25244A; --muted: #55587F; --outline: #25244A;
  --sun: #FFC933; --sky: #1F8FDB; --track: #DCEBFA; --gapbg: #FFF2BF;
  --l1: #FF7A66; --l1-ink: #1E1D45; --l2: #19B89F; --l2-ink: #1E1D45; --l3: #7B5CFA; --l3-ink: #FFFFFF;
  --ink-on: #1E1D45; --good: #0B7A55; --bad: #C42B44; --good-bg: #DDF6EC; --bad-bg: #FFE4E8;
  --mint: #19B89F; --mid: #FFC933; --low: #FF7A66; --blob1: #FFF0B3; --blob2: #CDF3EA;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif; --font-body: "Nunito", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13143A; --surface: #212457; --ink: #F2F3FF; --muted: #B4B7E2; --outline: #7A7EE0;
    --sky: #5CC0FF; --track: #2E3173; --gapbg: #3B3E86; --l3: #A18BFF; --l3-ink: #1E1D45;
    --good: #55E3AC; --bad: #FF93A4; --good-bg: #123F38; --bad-bg: #4A2041; --blob1: #2A2B6B; --blob2: #17415A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13143A; --surface: #212457; --ink: #F2F3FF; --muted: #B4B7E2; --outline: #7A7EE0;
  --sky: #5CC0FF; --track: #2E3173; --gapbg: #3B3E86; --l3: #A18BFF; --l3-ink: #1E1D45;
  --good: #55E3AC; --bad: #FF93A4; --good-bg: #123F38; --bad-bg: #4A2041; --blob1: #2A2B6B; --blob2: #17415A;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px; overflow-wrap: anywhere;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(circle at 8% 14%, var(--blob1) 0 150px, transparent 151px), radial-gradient(circle at 96% 30%, var(--blob2) 0 120px, transparent 121px); }
.wrap { max-width: 980px; margin-inline: auto; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; border-bottom: 2.5px dashed var(--track); }
.top-in { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); }
.brand-cat { width: 46px; display: block; } .brand-cat svg { width: 100%; height: auto; display: block; }
.brand-t { font: 800 1.45rem var(--font-display); }
.top-btns { display: flex; flex-wrap: wrap; gap: 10px; }

/* buttons */
.btn { font: 800 1rem/1.1 var(--font-display); border: 2.5px solid var(--outline); border-radius: 999px; background: var(--surface); color: var(--ink);
  padding: .65em 1.15em; min-height: 44px; cursor: pointer; box-shadow: 0 4px 0 var(--outline); display: inline-flex; align-items: center; justify-content: center; gap: .5em;
  transition: transform .08s, box-shadow .08s; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--outline); }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }
.btn.sm { padding: .5em .95em; min-height: 40px; font-size: .95rem; }
.btn.sun { background: var(--sun); color: var(--ink-on); }
.btn.go { background: var(--lc, var(--sky)); color: var(--lc-ink, #fff); }
.btn.big { font-size: 1.25rem; padding: .75em 1.6em; }
.l1 { --lc: var(--l1); --lc-ink: var(--l1-ink); } .l2 { --lc: var(--l2); --lc-ink: var(--l2-ink); } .l3 { --lc: var(--l3); --lc-ink: var(--l3-ink); }

/* generic */
main { padding-top: 22px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 14px; } .row.end { justify-content: flex-end; margin-top: 26px; }
.sec { font-size: 1.6rem; margin: 30px 0 14px; }
.chip { display: inline-block; font: 800 .85rem var(--font-display); letter-spacing: .04em; background: var(--lc, var(--sun)); color: var(--lc-ink, var(--ink-on)); border: 2px solid var(--outline); border-radius: 999px; padding: .15em .8em; }
.note { color: var(--muted); font-size: .92rem; margin-top: 10px; } .note.warn { color: var(--bad); font-weight: 700; } .small { font-size: .85rem; color: var(--muted); }
.txt { width: 100%; font: 700 1rem var(--font-body); color: var(--ink); background: var(--surface); border: 2.5px solid var(--outline); border-radius: 14px; padding: .55em .8em; min-height: 44px; }
.txt.mono { font: 600 .8rem ui-monospace, Menlo, monospace; resize: vertical; }
label { display: block; font-weight: 800; font-size: .88rem; margin: 12px 0 4px; }

/* cat + bubble */
.hero, .intro, .result { display: flex; flex-wrap: wrap; gap: 8px 26px; align-items: center; }
.hero-cat { flex: 0 0 auto; width: min(210px, 56%); margin-inline: auto; } .hero-cat.small { width: 90px; margin: 0; }
.cat svg { width: 100%; height: auto; display: block; overflow: visible; }
.bob { animation: bob 3.4s ease-in-out infinite; } .hop { animation: hop .9s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-7px); } } @keyframes hop { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-16px) rotate(2deg); } }
.bubble { position: relative; flex: 1 1 320px; min-width: 0; background: var(--surface); border: 2.5px solid var(--outline); border-radius: 26px; padding: 20px 22px; box-shadow: 0 6px 0 var(--outline); margin-top: 14px; }
.bubble::before { content: ""; position: absolute; left: 50%; top: -13px; width: 22px; height: 22px; margin-left: -11px; background: var(--surface); border-left: 2.5px solid var(--outline); border-top: 2.5px solid var(--outline); transform: rotate(45deg); }
@media (min-width: 700px) { .bubble { margin-top: 0; } .bubble::before { left: -13px; top: 44px; margin-left: 0; border-top: 0; border-left: 2.5px solid var(--outline); border-bottom: 2.5px solid var(--outline); } .hero-cat { margin-inline: 0; } }
.en { font: 800 1.12rem/1.5 var(--font-body); } .bubble.big .en { font-weight: 700; font-size: 1.05rem; } .es { color: var(--muted); font-size: .95rem; margin-top: 8px; }
.who { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 0 16px; margin-top: 8px; }
.mark { font: 800 3.4rem/1 var(--font-display); margin: 10px 0 4px; } .mark small { font-size: 1.3rem; color: var(--muted); }

/* levels */
.levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 20px; }
.lcard { background: var(--surface); border: 2.5px solid var(--outline); border-radius: 24px; box-shadow: 0 6px 0 var(--lc); padding: 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.lcard.off { opacity: .78; }
.lnum { width: 50px; height: 50px; border-radius: 50%; background: var(--lc); color: var(--lc-ink); border: 2.5px solid var(--outline); display: grid; place-items: center; font: 800 1.7rem var(--font-display); }
.lcard h3 { font-size: 1.35rem; } .lsub { color: var(--muted); font-size: .95rem; }
.lstat { font-weight: 800; font-size: .92rem; } .lcard .btn { margin-top: auto; align-self: flex-start; }
.pill { margin-top: auto; align-self: flex-start; font: 800 .85rem var(--font-display); border: 2px dashed var(--outline); border-radius: 999px; padding: .4em .9em; }
.pill.done { border-style: solid; background: var(--good-bg); color: var(--good); }
.bar { height: 16px; background: var(--track); border: 2px solid var(--outline); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--lc, var(--sky)); border-radius: 999px; transition: width .4s; }
.bar.good > i { background: var(--mint); } .bar.mid > i { background: var(--mid); } .bar.low > i { background: var(--low); }
.rules { margin: 26px 0 0; padding-left: 1.2em; color: var(--muted); } .rules li { margin-bottom: 4px; }
details { background: var(--surface); border: 2.5px solid var(--outline); border-radius: 18px; padding: 12px 16px; margin-top: 22px; }
summary { font: 800 1.02rem var(--font-display); cursor: pointer; }
.vocab .wgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 18px; margin-top: 12px; }
.wgroup h4 { font-size: 1rem; margin-bottom: 6px; } .wgroup ul { list-style: none; margin: 0; padding: 0; }
.wgroup li { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px dashed var(--track); } .wgroup li span { color: var(--muted); text-align: right; font-size: .92rem; }

/* intro tips */
.tips { margin-top: 26px; background: var(--surface); border: 2.5px solid var(--outline); border-radius: 22px; padding: 18px 22px; box-shadow: 0 6px 0 var(--lc); }
.tips h3 { font-size: 1.3rem; margin-bottom: 8px; } .tips ul { margin: 0; padding-left: 1.2em; } .tips li { margin-bottom: 6px; }

/* quiz */
.qtop { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; }
.qcount { font-weight: 800; color: var(--muted); }
.dots { display: flex; flex-wrap: wrap; gap: 7px; margin: 14px 0 20px; }
.dot { width: 38px; height: 38px; border-radius: 50%; border: 2.5px solid var(--outline); background: var(--surface); color: var(--ink); font: 800 .85rem var(--font-display); padding: 0; cursor: pointer; }
.dot.ans { background: var(--lc); color: var(--lc-ink); } .dot.skip { border-style: dashed; background: transparent; }
.dot.cur { outline: 3px solid var(--sky); outline-offset: 2px; }
.qcard { background: var(--surface); border: 2.5px solid var(--outline); border-radius: 28px; box-shadow: 0 7px 0 var(--lc); padding: 20px 22px 24px; }
.qnum { font: 800 .95rem var(--font-display); color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.qbody { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; margin-top: 8px; }
.qcat { flex: 0 0 auto; width: 96px; } .qmain { flex: 1 1 320px; min-width: 0; }
.sent { font: 700 clamp(1.2rem, 3.8vw, 1.65rem)/2.2 var(--font-body); }
.gap { font: 800 1em var(--font-body); color: var(--ink); background: var(--gapbg); border: 0; border-bottom: 3.5px solid var(--lc); border-radius: 9px 9px 0 0; padding: .05em .3em; text-align: center; max-width: 100%; min-width: 4.5ch; margin-inline: .15em; }
.blank { display: inline-block; min-width: 6ch; border-bottom: 3.5px solid var(--lc); text-align: center; font-weight: 800; padding: 0 .35em; background: var(--gapbg); border-radius: 9px 9px 0 0; }
.qhelp { color: var(--muted); font-size: .92rem; margin-top: 8px; }
.opts { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
.opt { flex: 1 1 150px; font: 800 1.12rem var(--font-body); padding: .8em 1em; min-height: 52px; border: 2.5px solid var(--outline); border-radius: 16px; background: var(--surface); color: var(--ink); cursor: pointer; box-shadow: 0 4px 0 var(--outline); }
.opt:hover { transform: translateY(-1px); } .opt[aria-pressed="true"] { background: var(--lc); color: var(--lc-ink); transform: translateY(2px); box-shadow: 0 2px 0 var(--outline); }
.qnav { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; margin-top: 24px; }
.confirm { margin-top: 20px; background: var(--surface); border: 3px solid var(--lc); border-radius: 22px; padding: 18px 22px; }
.confirm h3 { margin-bottom: 6px; }

/* result & report */
.errs { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.err { background: var(--surface); border: 2.5px solid var(--outline); border-radius: 20px; padding: 14px 18px; }
.errn { font: 800 .85rem var(--font-display); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.err p { margin-top: 6px; } .tag { display: inline-block; font: 800 .72rem var(--font-display); text-transform: uppercase; letter-spacing: .06em; padding: .1em .65em; border-radius: 999px; margin-right: .6em; }
.tag.bad { background: var(--bad-bg); color: var(--bad); } .tag.good { background: var(--good-bg); color: var(--good); }
u.bad { color: var(--bad); text-decoration-thickness: 2.5px; font-weight: 800; } u.good { color: var(--good); text-decoration-thickness: 2.5px; font-weight: 800; }
.why { color: var(--muted); font-size: .92rem; border-top: 1px dashed var(--track); padding-top: 6px; }
.rhead { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; } .rhead h2 { font-size: 2rem; } .rhead p { color: var(--muted); }
.gmark { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-top: 18px; background: var(--surface); border: 2.5px solid var(--outline); border-radius: 24px; padding: 14px 22px; box-shadow: 0 6px 0 var(--sun); }
.glabel { font: 800 .95rem var(--font-display); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.rrows, .crows { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.rrow, .crow { background: var(--surface); border: 2.5px solid var(--outline); border-radius: 18px; padding: 14px 18px; }
.rtitle, .crit-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin-bottom: 6px; } .rtitle span, .crit-h span { color: var(--muted); font-size: .9rem; }
.crow > p:not(.small) { font-size: .95rem; margin-bottom: 8px; }
.critbar { display: flex; align-items: center; gap: 12px; } .critbar .bar { flex: 1; height: 20px; } .pctn { font: 800 1.1rem var(--font-display); min-width: 3.6em; text-align: right; }
.eblock { margin-bottom: 22px; } .eblock h3 { font-size: 1.25rem; margin-bottom: 10px; }

#toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 30px); max-width: min(92vw, 520px); background: var(--ink); color: var(--bg); font-weight: 700; padding: .75em 1.2em; border-radius: 16px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 20; text-align: center; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .bob, .hop { animation: none; } .btn, .bar > i, #toast { transition: none; } }
</style>

<script>
/* ===== DATA ===== */
const CRIT = {
  c11: { code: "1.1", ce: "Competencia específica 1 · Comprensión", text: "Extraer el sentido global y la información específica de textos escritos breves, apoyándose en el contexto y en las pistas temporales (ago, last, yesterday, for, since, yet…)." },
  c22: { code: "2.2", ce: "Competencia específica 2 · Producción", text: "Redactar textos breves con corrección formal: formar bien las estructuras verbales (past simple y present perfect) con léxico cotidiano." },
  c23: { code: "2.3", ce: "Competencia específica 2 · Producción", text: "Seleccionar y aplicar estrategias de producción y revisión: elegir la forma adecuada y revisar las propias respuestas." },
  c51: { code: "5.1", ce: "Competencia específica 5 · Repertorio lingüístico", text: "Comparar y contrastar el funcionamiento de la lengua extranjera con el de otras lenguas, reflexionando sobre el uso de los dos tiempos verbales." }

const CRIT_ORDER = ["c11", "c22", "c23", "c51"];

const LV = [
  {
    id: 1, title: "Past Simple", sub: "Pistas: ago, last, yesterday, in 2019…", cls: "l1",
    say: "Hello, I'm Copy The Cat! In this level we practise the past simple. We use it for actions that finished at a definite time in the past. Look for clues like yesterday, last week, two days ago, in 2019 or when I was ten. For regular verbs, add ed: visit, visited. Irregular verbs change: go, went. For questions and negatives, use did or didn't plus the base verb: Did you see it? I didn't see it. Ready? Off we go!",
    es: "Usamos el past simple para acciones terminadas en un momento concreto del pasado.",
    tips: [
      "Pista de tiempo terminado (yesterday, last week, two days ago, in 2019, when I was ten) → past simple.",
      "Verbos regulares: verbo + -ed (visit → visited, study → studied, stop → stopped).",
      "Verbos irregulares: hay que memorizarlos (go → went, buy → bought).",
      "Preguntas y negativas: did / didn't + verbo base, sin -ed (Did you see…? I didn't see…)."
    ]
  },
  {
    id: 2, title: "Present Perfect", sub: "Yet, already, just, never, ever, for, since", cls: "l2",
    say: "Welcome to level two! The present perfect has two parts: have or has, plus the past participle. We use it for experiences, for recent news, and for things that started in the past and continue now. Yet is for negatives and questions, and it goes at the end. Already means sooner than expected. Just means a moment ago. Ever is for questions, and never means not at any time. Use for with a period of time, and since with a starting point. Have a go!",
    es: "Have/has + participio. Sirve para experiencias, noticias recientes y cosas que empezaron en el pasado y siguen ahora.",
    tips: [
      "Formación: have / has + participio (he, she, it → has).",
      "YET: en negativas y preguntas, al final (She hasn't finished yet). ALREADY: ya. JUST: acaba de.",
      "EVER: en preguntas (Have you ever…?). NEVER: nunca, sin otra negación.",
      "FOR + periodo (for two years). SINCE + punto de inicio (since 2019)."
    ]
  },
  {
    id: 3, title: "Elige el tiempo", sub: "Past simple o present perfect", cls: "l3",
    say: "Final level! Now you must choose: past simple or present perfect. If the time is finished and named, such as yesterday, last year or in 2018, use the past simple. If the time is not mentioned, or it is connected to now, use the present perfect. Clues like ever, never, just, already, yet, for, since and so far point to the present perfect. Think about the clue before you choose. Good luck!",
    es: "Tiempo terminado y mencionado → past simple. Conectado con el presente → present perfect.",
    tips: [
      "Momento terminado y concreto (yesterday, last year, in 2018, ago, When…?) → past simple.",
      "Sin tiempo concreto o conectado con ahora → present perfect.",
      "Pistas de present perfect: ever, never, just, already, yet, for, since, so far, How long…?",
      "Lee la frase entera: el contexto (por ejemplo «and she loves it») también da pistas."
    ]
  }

/* Question format.
   typed:  { s: "text with ___ gaps", a: ["answer|alt", ...one per gap], w: "why", k: [criteria] }
   choice: { s: "text with one ___", o: [options], c: index of correct, w: "why", k: [criteria] } */
const Q = [
  /* ---- Level 1: past simple ---- */
  [

<div class="who">
<div><label for="nm">Tu nombre</label><input id="nm" class="txt" type="text" autocomplete="name" maxlength="60" value="${esc(S.name)}" placeholder="Nombre y apellidos"></div>
<div><label for="gr">Curso / grupo</label><input id="gr" class="txt" type="text" maxlength="30" value="${esc(S.group)}" placeholder="3º ESO A"></div>
</div></div></section>
<h2 class="sec">Elige tu aventura</h2>
<div class="levels">${[0, 1, 2].map(lcard).join("")}</div>
${storeOK ? "" : '<p class="note warn">Este navegador no permite guardar el progreso automáticamente. Usa el código de recuperación de abajo antes de cerrar la página.</p>'}
<ul class="rules">
<li>Tu progreso se guarda solo: puedes cerrar la página y seguir cuando quieras.</li>
<li>Puedes cambiar tus respuestas y saltar preguntas tantas veces como necesites.</li>
<li>Los fallos aparecen al terminar cada nivel. Un nivel terminado no se puede repetir.</li>
</ul>
<details class="code"><summary>Guardar o recuperar mi progreso en otro dispositivo</summary>
<p>Copia este código y pégalo en otro navegador para seguir donde lo dejaste.</p>
<textarea id="codeOut" class="txt mono" rows="3" readonly>${esc(code())}</textarea>
<div class="row"><button class="btn sm" data-act="copycode">Copiar código</button></div>
<label for="codeIn">Pegar un código guardado (sustituye el progreso de este navegador)</label>
<textarea id="codeIn" class="txt mono" rows="3"></textarea>
<div class="row"><button class="btn sm" data-act="restore">Recuperar progreso</button><span class="note" id="restoreMsg">${esc(ui.restoreMsg)}</span></div>
</details>`;
  }

  function vIntro(l) {
    const m = LV[l];
    return `<section class="intro ${m.cls}">
<div class="hero-cat cat bob">${cat("think")}</div>
<div class="bubble big">
<span class="chip">Nivel ${l + 1} · ${esc(m.title)}</span>
<p class="en" lang="en-GB">${esc(m.say)}</p>
<p class="es">${esc(m.es)}</p>
<div class="row"><button class="btn sun" data-act="speak" data-l="${l}">${iconPlay} Escuchar a Copy (inglés británico)</button></div>
</div></section>
<section class="tips"><h3>Pistas de Copy</h3><ul>${m.tips.map(t => `<li>${esc(t)}</li>`).join("")}</ul></section>
${vocab()}
<div class="row end"><button class="btn go big" data-act="start" data-l="${l}">${S.levels[l].intro && stats(l).ans ? "Seguir con el nivel" : "¡Vamos allá!"}</button></div>`;
  }

  function dotCls(l, k) {
    const L = S.levels[l];
    return "dot" + (k === L.cur ? " cur" : "") + (isAns(l, k) ? " ans" : L.vis[k] && k !== L.cur ? " skip" : "");
  }
  function dotLabel(l, k) {
    const L = S.levels[l];
    return `Pregunta ${k + 1}, ` + (isAns(l, k) ? "respondida" : L.vis[k] && k !== L.cur ? "saltada" : "sin responder");
  }

  function vQuiz(l) {
    const L = S.levels[l], m = LV[l], i = L.cur, q = Q[l][i];
    L.vis[i] = true;
    const ans = L.ans[i];
    let body = "", help = "";
    if (q.o) {
      const chosen = typeof ans === "number" ? q.o[ans] : "";
      body = `<p class="sent">${sentence(q, [chosen], v => `<span class="blank">${esc(v) || "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"}</span>`)}</p>
<div class="opts" role="group" aria-label="Opciones">${q.o.map((o, k) => `<button class="opt" data-act="pick" data-k="${k}" aria-pressed="${ans === k}">${esc(o)}</button>`).join("")}</div>`;
      help = l === 2 ? "Elige la opción correcta: piensa en la pista de tiempo." : "Elige la palabra correcta para completar la frase.";
    } else {
      const vals = Array.isArray(ans) ? ans : [];
      let g = 0;
      body = `<p class="sent">${q.s.split("___").map((p, k, all) => {
        let h = esc(p);
        if (k < all.length - 1) {
          const len = Math.max(...q.a[g].split("|").map(x => x.length)) + 2;
          h += `<input class="gap" id="gap${g}" data-g="${g}" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Hueco ${g + 1}" style="width:calc(${len}ch + 1.4em)" value="${esc(vals[g] || "")}">`;
          g++;
        }
        return h;
      }).join("")}</p>`;
      help = q.a.length > 1 ? "Hay más de un hueco: completa todos con la forma correcta." : "Completa el hueco con la forma correcta del verbo entre paréntesis.";
    }
    const missing = [];
    for (let k = 0; k < 20; k++) if (!isAns(l, k)) missing.push(k + 1);
    const nextLabel = i < 19 ? (isAns(l, i) ? "Siguiente" : "Saltar") : missing.length ? "Volver a las que faltan" : "Terminar nivel";
    const confirm = ui.confirm ? `<div class="confirm" role="alertdialog" aria-labelledby="cft">
<h3 id="cft">¿Terminar el nivel ${l + 1}?</h3>
<p>${missing.length ? `Te quedan sin responder: <b>${missing.join(", ")}</b>. Cuentan como fallos.` : "Has respondido todas las preguntas."} Después verás tus fallos y ya no podrás volver a este nivel ni cambiar respuestas.</p>
<div class="row"><button class="btn" data-act="cancel">Seguir revisando</button><button class="btn go" data-act="confirm">Terminar y ver mi nota</button></div></div>` : "";
    return `<section class="quiz ${m.cls}">
<div class="qtop"><span class="chip">Nivel ${l + 1} · ${esc(m.title)}</span><span class="qcount" id="qcount">${stats(l).ans} de 20 respondidas</span><button class="btn sm" data-act="intro">Pistas de Copy</button></div>
<div class="dots" id="dots" role="group" aria-label="Ir a una pregunta">${Array.from({ length: 20 }, (_, k) => `<button class="${dotCls(l, k)}" data-act="goq" data-k="${k}" aria-label="${dotLabel(l, k)}"${k === i ? ' aria-current="step"' : ""}>${k + 1}</button>`).join("")}</div>
<div class="qcard"><div class="qhead"><span class="qnum">Pregunta ${i + 1} de 20</span></div>
<div class="qbody"><div class="qcat cat">${cat("think")}</div><div class="qmain">${body}<p class="qhelp">${esc(help)}</p></div></div></div>
<div class="qnav"><button class="btn" data-act="prev"${i === 0 ? " disabled" : ""}>Anterior</button><button class="btn" data-act="next">${nextLabel}</button><button class="btn go" data-act="finish">Terminar nivel</button></div>
${confirm}
${vocab()}</section>`;
  }

  function errItem(l, e) {
    const youHtml = e.none ? `<span class="none">Sin responder</span>` : sentence(e.q, e.user, v => `<u class="bad">${esc(v) || "…"}</u>`);
    return `<li class="err"><div class="errn">Pregunta ${e.n}</div>
<p><span class="tag bad">${e.none ? "Sin responder" : "Tu respuesta"}</span>${e.none ? esc(e.q.s.replace(/___/g, "____")) : youHtml}</p>
<p><span class="tag good">Correcta</span>${sentence(e.q, e.right, v => `<u class="good">${esc(v)}</u>`)}</p>
<p class="why">${esc(e.q.w)}</p></li>`;
  }

  function vResult(l) {
    const st = stats(l), m = LV[l], errs = errorsOf(l);
    const mood = st.mark >= 9 ? "cheer" : st.mark >= 5 ? "happy" : "oops";
    const en = st.mark >= 9 ? "Purr-fect! Excellent work!" : st.mark >= 5 ? "Well done! You're getting there." : "Don't worry, mistakes help us learn. Let's look at them together.";
    const es = st.mark >= 9 ? "¡Perfecto! Trabajo excelente." : st.mark >= 5 ? "¡Bien hecho! Vas por buen camino." : "No te preocupes: los errores nos ayudan a aprender. Vamos a revisarlos.";
    const next = l < 2 ? `<button class="btn go" data-act="gonext" data-l="${l + 1}">Ir al nivel ${l + 2}</button>` : `<button class="btn go" data-act="report">Ver mi informe final</button>`;
    return `<section class="result ${m.cls}">
<div class="hero-cat cat ${mood === "cheer" ? "hop" : "bob"}">${cat(mood)}</div>
<div class="bubble big"><span class="chip">Nivel ${l + 1} terminado · ${esc(m.title)}</span>
<p class="mark">${fmt(st.mark)}<small> / 10</small></p>
<p><b>${st.ok}</b> aciertos de 20 · <b>${20 - st.ok}</b> fallos</p>
<p class="en" lang="en-GB">${en}</p><p class="es">${es}</p></div></section>
<h2 class="sec">${errs.length ? "Tus fallos de este nivel" : "¡Ningún fallo en este nivel!"}</h2>
${errs.length ? `<ul class="errs">${errs.map(e => errItem(l, e)).join("")}</ul>` : ""}
<div class="row end"><button class="btn" data-act="home">Volver al inicio</button>${next}</div>`;
  }

  function vReport() {
    const g = globalMark(), cs = critStats();
    const rows = [0, 1, 2].map(l => {
      const L = S.levels[l], st = stats(l), m = LV[l];
      const status = L.done ? `Terminado · ${st.ok}/20 aciertos` : st.ans ? `En curso · ${st.ans}/20 respondidas` : "Pendiente";
      return `<li class="rrow ${m.cls}"><div class="rtitle"><b>Nivel ${l + 1} · ${esc(m.title)}</b><span>${esc(status)}</span></div>
<div class="critbar"><div class="bar"><i style="width:${L.done ? st.ok * 5 : 0}%"></i></div><b class="pctn">${L.done ? fmt(st.mark) + "/10" : "—"}</b></div></li>`;
    }).join("");
    const crit = cs.map(c => `<li class="crow"><div class="crit-h"><b>Criterio ${CRIT[c.k].code}</b><span>${esc(CRIT[c.k].ce)}</span></div>
<p>${esc(CRIT[c.k].text)}</p>
<div class="critbar"><div class="bar ${barCls(c.pct)}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${c.pct === null ? 0 : c.pct}" aria-label="Consecución del criterio ${CRIT[c.k].code}"><i style="width:${c.pct === null ? 0 : c.pct}%"></i></div><b class="pctn">${c.pct === null ? "—" : c.pct + "%"}</b></div>
<p class="small">${c.total ? `${c.ok} de ${c.total} ítems correctos` : "Se calcula al terminar al menos un nivel"}</p></li>`).join("");
    const errBlocks = [0, 1, 2].filter(l => S.levels[l].done).map(l => {
      const errs = errorsOf(l);
      return `<div class="eblock ${LV[l].cls}"><h3>Nivel ${l + 1} · ${esc(LV[l].title)}</h3>${errs.length ? `<ul class="errs">${errs.map(e => errItem(l, e)).join("")}</ul>` : '<p class="note">Sin fallos.</p>'}</div>`;
    }).join("");
    return `<section class="report">
<div class="rhead"><div><h2>Informe de progreso</h2><p>${esc(S.name || "Alumno/a sin nombre")}${S.group ? " · " + esc(S.group) : ""} · ${new Date().toLocaleDateString("es-ES")}</p></div>
<button class="btn sun" data-act="pdf">${iconDl} Descargar informe PDF</button></div>
<div class="gmark"><div class="hero-cat cat small">${cat(g && g.mark >= 5 ? "happy" : "think")}</div><div><p class="glabel">Nota global${g && g.n < 3 ? " provisional (" + g.n + " de 3 niveles)" : ""}</p><p class="mark">${g ? fmt(g.mark) : "—"}<small> / 10</small></p></div></div>
<h3 class="sec">Resultados por nivel</h3><ul class="rrows">${rows}</ul>
<h3 class="sec">Criterios de evaluación (LOMLOE · Andalucía · 3º ESO · Lengua Extranjera)</h3>
<ul class="crows">${crit}</ul>
<p class="note">Porcentaje de consecución = ítems correctos entre los ítems asociados al criterio, en los niveles terminados. La asociación de ítems a criterios es orientativa; el profesorado puede contrastarla con la Orden de 30 de mayo de 2023 (Andalucía).</p>
<h3 class="sec">Fallos por nivel</h3>
${errBlocks || '<p class="note">Los fallos de cada nivel aparecerán aquí cuando lo termines.</p>'}
</section>`;
  }

  /* ---------- render ---------- */
  function render() {
    fixNav();
    $hdr.innerHTML = vHeader();
    const n = S.nav;
    $app.innerHTML = n.v === "intro" ? vIntro(n.lv) : n.v === "quiz" ? vQuiz(n.lv) : n.v === "result" ? vResult(n.lv) : n.v === "report" ? vReport() : vHome();
  }
  function go(v, lv) {
    stopSpeech(); ui.confirm = false;
    S.nav = { v, lv: lv === undefined ? S.nav.lv : lv };
    save(); render();
    try { window.scrollTo({ top: 0 }); } catch (e) { /* ignore */ }
  }
  function refreshQuizBits() {
    const l = S.nav.lv;
    const c = document.getElementById("qcount");
    if (c) c.textContent = stats(l).ans + " de 20 respondidas";
    document.querySelectorAll("#dots .dot").forEach((d, k) => { d.className = dotCls(l, k); d.setAttribute("aria-label", dotLabel(l, k)); });
  }
  function finishLevel(l) {
    S.levels[l].done = true; S.levels[l].fin = Date.now();
    go("result", l);
  }

  /* ---------- speech ---------- */
  function speak(text) {
    if (!("speechSynthesis" in window)) { toast("Tu navegador no puede reproducir voz. Lee el texto de Copy en pantalla."); return; }
    const ss = speechSynthesis;
    ss.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-GB"; u.rate = 0.92; u.pitch = 1.15;
    const vs = ss.getVoices();
    const v = vs.find(x => /^en[-_]GB$/i.test(x.lang) && /female|libby|sonia|kate|serena|hazel|susan/i.test(x.name)) || vs.find(x => /^en[-_]GB$/i.test(x.lang));
    if (v) u.voice = v; else if (vs.length) toast("No hay voz británica instalada en este dispositivo: se usará otra voz inglesa.");
    ss.speak(u);
  }

  /* ---------- PDF ---------- */
  const pdfSafe = s => String(s).replace(/…/g, "...").replace(/[→]/g, "->").replace(/[—–]/g, "-").replace(/[’‘]/g, "'").replace(/[“”]/g, '"');

  function buildPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "mm", format: "a4" });
    const PW = 210, PH = 297, M = 16, CW = PW - 2 * M;
    const INK = [37, 36, 74], MUTED = [90, 93, 134];
    let y = 0;
    const need = h => { if (y + h > PH - 20) { doc.addPage(); y = 20; } };
    const write = (str, x, size, style, color, maxW) => {
      doc.setFont("helvetica", style || "normal"); doc.setFontSize(size);
      const c = color || INK; doc.setTextColor(c[0], c[1], c[2]);
      const lh = size * 0.45;
      doc.splitTextToSize(pdfSafe(str), maxW || CW).forEach(ln => { need(lh); doc.text(ln, x, y); y += lh; });
    };
    const bar = (x, w, pct, color) => {
      doc.setFillColor(220, 235, 250); doc.rect(x, y, w, 4.2, "F");
      if (pct > 0) { doc.setFillColor(color[0], color[1], color[2]); doc.rect(x, y, Math.max(1, (w * pct) / 100), 4.2, "F"); }
      doc.setDrawColor(INK[0], INK[1], INK[2]); doc.setLineWidth(0.3); doc.rect(x, y, w, 4.2, "S");
    };
    const colFor = p => (p >= 70 ? [25, 184, 159] : p >= 50 ? [255, 201, 51] : [255, 122, 102]);

    // header band
    doc.setFillColor(255, 201, 51); doc.rect(0, 0, PW, 32, "F");
    y = 15; write("Copy The Cat · Informe de progreso", M, 20, "bold");
    y = 23; write("Past simple y present perfect · Inglés B1 · 3º ESO", M, 10.5, "normal", INK);
    y = 44;
    write("Alumno/a: " + (S.name || "(sin nombre)"), M, 12, "bold");
    y += 1; write("Grupo: " + (S.group || "(sin indicar)") + "    Fecha: " + new Date().toLocaleDateString("es-ES"), M, 10.5, "normal", MUTED);
    y += 6;

    const g = globalMark();
    write("Nota global: " + (g ? fmt(g.mark) + " / 10" : "sin niveles terminados") + (g && g.n < 3 ? "  (provisional: " + g.n + " de 3 niveles)" : ""), M, 15, "bold");
    y += 5;

    write("Resultados por nivel", M, 13, "bold"); y += 2;
    [0, 1, 2].forEach(l => {
      const L = S.levels[l], st = stats(l);
      need(16);
      const label = "Nivel " + (l + 1) + " · " + LV[l].title;
      const status = L.done ? "Terminado · " + st.ok + "/20 aciertos" : st.ans ? "En curso · " + st.ans + "/20 respondidas (sin calificar)" : "Pendiente";
      write(label, M, 11, "bold"); y -= 4.5;
      doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.text(L.done ? fmt(st.mark) + " / 10" : "-", M + CW, y, { align: "right" }); y += 4.5;
      write(status, M, 9.5, "normal", MUTED);
      bar(M, CW, L.done ? st.ok * 5 : 0, colFor(L.done ? st.ok * 5 : 0)); y += 9;
    });

    y += 2; need(20);
    write("Criterios de evaluación (LOMLOE · Andalucía · 3º ESO · Lengua Extranjera)", M, 13, "bold"); y += 2;
    critStats().forEach(c => {
      need(28);
      write("Criterio " + CRIT[c.k].code + "  (" + CRIT[c.k].ce + ")", M, 10.5, "bold");
      write(CRIT[c.k].text, M, 9.5, "normal", MUTED);
      y += 1;
      bar(M, CW - 24, c.pct || 0, colFor(c.pct || 0));
      doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); doc.setTextColor(INK[0], INK[1], INK[2]);
      doc.text(c.pct === null ? "-" : c.pct + " %", M + CW, y + 3.6, { align: "right" });
      y += 6;
      write(c.total ? c.ok + " de " + c.total + " items correctos" : "Se calcula al terminar al menos un nivel", M, 9, "normal", MUTED);
      y += 3;
    });
    write("Porcentaje de consecucion = items correctos entre los items asociados a cada criterio, en los niveles terminados. La asociacion de items a criterios es orientativa (Orden de 30 de mayo de 2023, Andalucia).", M, 8.5, "italic", MUTED);
    y += 5;

    need(20);
    write("Fallos por nivel", M, 13, "bold"); y += 2;
    let any = false;
    [0, 1, 2].forEach(l => {
      const L = S.levels[l];
      need(14);
      write("Nivel " + (l + 1) + " · " + LV[l].title, M, 11.5, "bold"); y += 1;
      if (!L.done) { write("Nivel no terminado: los fallos se muestran al finalizarlo.", M, 9.5, "italic", MUTED); y += 3; return; }
      any = true;
      const errs = errorsOf(l);
      if (!errs.length) { write("Sin fallos.", M, 10, "normal", MUTED); y += 3; return; }
      errs.forEach(e => {
        need(22);
        write(e.n + ". " + (e.none ? e.q.s.replace(/___/g, "____") + "   [sin responder]" : plainSentence(e.q, e.user)), M, 9.8, "normal", INK);
        write("Correcta: " + plainSentence(e.q, e.right), M + 4, 9.5, "bold", [14, 122, 85], CW - 4);
        write(e.q.w, M + 4, 8.8, "italic", MUTED, CW - 4);
        y += 2.5;
      });
      y += 3;
    });
    if (!any) { write("Aun no hay niveles terminados.", M, 10, "italic", MUTED); }

    const pages = doc.getNumberOfPages();
    for (let p = 1; p <= pages; p++) {
      doc.setPage(p); doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(MUTED[0], MUTED[1], MUTED[2]);
      doc.text("Copy The Cat · Past simple y present perfect · 3º ESO (B1)", M, PH - 10);
      doc.text("Pagina " + p + " de " + pages, M + CW, PH - 10, { align: "right" });
    }
    return doc;
  }

  async function downloadPDF() {
    if (!window.jspdf) { toast("No se ha podido cargar el generador de PDF. Comprueba la conexión y recarga la página."); return; }
    let dl = null;
    try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { dl = null; }
    if (!dl) { toast("La descarga de archivos no está disponible en esta vista. Abre la página en claude.ai para descargar el PDF."); return; }
    try {
      const doc = buildPDF();
      await dl.save({ filename: "informe-copy-the-cat-" + slug(S.name) + ".pdf", data: doc.output("arraybuffer") });
      toast("Informe guardado.");
    } catch (e) {
      if (e && e.code === "declined") return;
      toast("No se pudo guardar el PDF" + (e && e.code ? " (" + e.code + ")" : "") + ". Inténtalo de nuevo.");
    }
  }

  /* ---------- events ---------- */
  document.addEventListener("click", ev => {
    const t = ev.target.closest("[data-act]");
    if (!t) return;
    const act = t.dataset.act, l = S.nav.lv;
    const L = S.levels[l];
    switch (act) {
      case "home": go("home"); break;
      case "report": go("report"); break;
      case "pdf": downloadPDF(); break;
      case "open": { const k = +t.dataset.l; if (!unlocked(k) || S.levels[k].done) return; go(S.levels[k].intro ? "quiz" : "intro", k); break; }
      case "gonext": { const k = +t.dataset.l; go(unlocked(k) ? "intro" : "home", k); break; }
      case "intro": go("intro"); break;
      case "start": { S.levels[+t.dataset.l].intro = true; go("quiz", +t.dataset.l); break; }
      case "speak": speak(LV[+t.dataset.l].say); break;
      case "goq": L.cur = +t.dataset.k; ui.confirm = false; save(); render(); break;
      case "prev": if (L.cur > 0) { L.cur--; ui.confirm = false; save(); render(); } break;
      case "next": {
        if (L.cur < 19) { L.cur++; }
        else { const f = L.ans.findIndex((_, k) => !isAns(l, k)); if (f >= 0) L.cur = f; else ui.confirm = true; }
        save(); render(); break;
      }
      case "pick": L.ans[L.cur] = +t.dataset.k; save(); render(); break;
      case "finish": ui.confirm = true; render(); break;
      case "cancel": ui.confirm = false; render(); break;
      case "confirm": finishLevel(l); break;
      case "copycode": {
        const ta = document.getElementById("codeOut");
        const done = () => toast("Código copiado.");
        const fb = () => { ta.focus(); ta.select(); toast("Selecciona el código y cópialo (Ctrl+C)."); };
        try { navigator.clipboard.writeText(ta.value).then(done, fb); } catch (e) { fb(); }
        break;
      }
      case "restore": {
        const txt = (document.getElementById("codeIn").value || "").trim();
        try {
          const o = JSON.parse(decodeURIComponent(escape(atob(txt))));
          if (!valid(o)) throw new Error("bad");
          S = o; save(); ui.restoreMsg = ""; go("home", 0); toast("Progreso recuperado.");
        } catch (e) { ui.restoreMsg = "El código no es válido."; const m = document.getElementById("restoreMsg"); if (m) m.textContent = ui.restoreMsg; }
        break;
      }
      default: break;
    }
  });

  document.addEventListener("input", ev => {
    const t = ev.target;
    if (t.id === "nm") { S.name = t.value; save(); return; }
    if (t.id === "gr") { S.group = t.value; save(); return; }
    if (t.classList && t.classList.contains("gap") && S.nav.v === "quiz") {
      const l = S.nav.lv, L = S.levels[l], q = Q[l][L.cur];
      const arr = Array.isArray(L.ans[L.cur]) ? L.ans[L.cur].slice() : Array(gapsOf(q)).fill("");
      arr[+t.dataset.g] = t.value;
      L.ans[L.cur] = arr.some(x => String(x).trim() !== "") ? arr : null;
      save(); refreshQuizBits();
    }
  });

  document.addEventListener("keydown", ev => {
    if (ev.key !== "Enter" || !ev.target.classList || !ev.target.classList.contains("gap")) return;
    ev.preventDefault();
    const gaps = Array.from(document.querySelectorAll(".gap")), k = gaps.indexOf(ev.target);
    if (k < gaps.length - 1) gaps[k + 1].focus();
    else document.querySelector('[data-act="next"]').click();
  });

  if ("speechSynthesis" in window) { try { speechSynthesis.getVoices(); } catch (e) { /* ignore */ } }
  window.addEventListener("pagehide", stopSpeech);
  render();
})();

</script>

</body></html>
